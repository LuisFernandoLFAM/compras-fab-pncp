[project]
name = "compras-fab-pncp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "pytz>=2026.6",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = [".", "test"]
testpaths = ["test"]
markers = ["integracao: chama a API real do PNCP; fora da execução padrão"]
addopts = "-m 'not integracao'"
